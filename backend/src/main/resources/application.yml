spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=kiosk;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:ChangeThis_DevelopmentPassword1}
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt-secret: ${APP_JWT_SECRET:dev-change-me-32-byte-secret-key}
  kiosk-timeout-seconds: ${KIOSK_TIMEOUT_SECONDS:180}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:ChangeThis_AdminPassword1}
server.port: ${SERVER_PORT:8080}
