services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: kiosk, POSTGRES_USER: kiosk, POSTGRES_PASSWORD: kiosk}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kiosk
      SPRING_DATASOURCE_USERNAME: kiosk
      SPRING_DATASOURCE_PASSWORD: kiosk
    ports: ["8080:8080"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes: {postgres-data: {}}
